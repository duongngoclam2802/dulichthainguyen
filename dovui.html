    <style>
        /* --- Biến màu và cài đặt gốc --- */
        :root {
            --primary-color: #00796b;
            --secondary-color: #005a4d;
            --text-dark: #212529;
            --text-light: #f8f9fa;
            --background-light: #f4f7f6;
            --white-color: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.07);
            --correct-bg: #a5d6a7;
            --correct-border: #388e3c;
            --correct-text: #1b5e20;
            --wrong-bg: #ef9a9a;
            --wrong-border: #d32f2f;
            --wrong-text: #b71c1c;
        }

        /* --- Reset và cài đặt chung --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.7;
            background-color: var(--background-light);
            color: var(--text-dark);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0;
        }

        body.fade-in {
            opacity: 1;
        }
        
        /* --- Thanh điều hướng (Navbar) --- */
        nav {
            background-color: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px var(--shadow-color);
            width: 100%;
            margin-bottom: 20px;
        }
        
        nav .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-logo a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--secondary-color);
            font-size: 1.5em;
            font-weight: 700;
        }
        
        .nav-logo img {
            width: 35px;
            height: 35px;
        }
        
        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        nav a {
            display: block;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 1em;
            padding: 15px;
            transition: color 0.3s ease;
            white-space: nowrap;
        }
        
        nav a.active {
            color: var(--primary-color);
            font-weight: 700;
        }
        
        nav a:not(.active):hover {
            color: var(--primary-color);
        }

        .menu-toggle {
            display: none;
            font-size: 1.8em;
            cursor: pointer;
            color: var(--primary-color);
        }

        /* --- Màn hình tải game --- */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--white-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: 1.2em;
            color: var(--primary-color);
        }

        #loading img {
            width: 100px;
            height: 100px;
        }

        /* --- Khung Game --- */
        .quiz-container {
            display: none;
            flex-direction: column;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            width: 95%;
            background: var(--white-color);
            text-align: center;
            position: relative;
            margin-bottom: 50px;
        }
        
        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 28px;
        }

        .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        #question {
            font-size: 22px;
            color: var(--text-dark);
            margin-bottom: 20px;
            min-height: 60px;
            user-select: none;
        }

        #answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .answer {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
            user-select: none;
            font-size: 18px;
            text-align: left;
        }

        .answer:hover {
            background: #e0f7fa;
            border-color: #26c6da;
        }

        .answer.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: bold;
        }

        .answer.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
            font-weight: bold;
        }
        
        .answer.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            user-select: none;
        }

        button:hover {
            background-color: var(--secondary-color);
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #score {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
            color: var(--primary-color);
        }

        #hint, #explanation {
            margin-top: 15px;
            color: #555;
            min-height: 24px;
            font-size: 16px;
            font-style: italic;
            line-height: 1.5;
        }
        
        #final-result {
            display: none;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
        }

        /* --- Responsive cho thiết bị di động --- */
        @media (min-width: 992px) {
            nav ul {
                display: flex;
            }
            .menu-toggle {
                display: none;
            }
        }

        @media (max-width: 991px) {
            nav .nav-container {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            nav ul {
                display: none;
                flex-direction: column;
                width: 100%;
                text-align: center;
                position: absolute;
                top: 60px;
                left: 0;
                background-color: rgba(255, 255, 255, 0.97);
                box-shadow: 0 8px 16px var(--shadow-color);
                border-top: 1px solid #eee;
                padding: 10px 0;
            }

            nav ul.active {
                display: flex;
            }

            nav ul.active li {
                opacity: 1; 
                transform: translateY(0); 
            }

            nav a {
                padding: 12px 15px;
                border-bottom: 1px solid #f0f0f0;
            }

            nav ul li:last-child a {
                border-bottom: none;
            }

            .menu-toggle {
                display: block;
            }
        }

        @media (max-width: 480px) {
            .quiz-container { padding: 20px; }
            h1 { font-size: 24px; }
            #question { font-size: 18px; }
            .answer { font-size: 16px; padding: 12px; }
            button { font-size: 14px; padding: 10px 15px; }
            #score { font-size: 16px; }
            #hint, #explanation { font-size: 14px; }
        }

        /* Animation khi chưa trả lời mà nhấn Next */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>

        });
        
        scoreEl.textContent = `Điểm: ${score} / ${questions.length}`;
        nextBtn.textContent = (currentQuestionIndex === questions.length - 1) ? '🏁 Hoàn thành' : '➡️ Câu tiếp theo';
        nextBtn.disabled = true;
    }

    function resetState() {
        hintEl.style.display = 'none';
        explanationEl.style.display = 'none';
        hintEl.textContent = '';
        explanationEl.textContent = '';
        answersEl.innerHTML = '';
        nextBtn.disabled = true;
        hintBtn.disabled = false;
    }

    function selectAnswer(selectedBtn, index) {
        if (answered) return;
        answered = true;
        nextBtn.disabled = false;
        hintBtn.disabled = true;

        const q = questions[currentQuestionIndex];
        const answerButtons = Array.from(answersEl.children);

        if (index === q.correct) {
            score++;
            selectedBtn.classList.add('correct');
        } else {
            selectedBtn.classList.add('wrong');
        }

        answerButtons.forEach((btn, i) => {
            if (i === q.correct) {
                btn.classList.add('correct');
            }
            btn.classList.add('disabled');
        });
        
        explanationEl.textContent = "🔎 Giải thích: " + q.explanation;
        explanationEl.style.display = 'block';
        scoreEl.textContent = `Điểm: ${score} / ${questions.length}`;
    }

    function showHint() {
        if (answered) return;
        const q = questions[currentQuestionIndex];
        hintEl.textContent = "💡 Gợi ý: " + q.hint;
        hintEl.style.display = 'block';
        hintBtn.disabled = true;
    }

    function nextQuestion() {
        if (!answered) {
            answersEl.style.animation = 'shake 0.5s';
            setTimeout(() => { answersEl.style.animation = '' }, 500);
            return;
        }
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showFinalScore();
        }
    }

    function showFinalScore() {
        gameViewEl.style.display = 'none';
        finalResultEl.style.display = 'flex';
        
        document.getElementById('final-score').textContent = `Điểm của bạn: ${score} / ${questions.length}`;
        
        let message = "Tuyệt vời! Bạn là một chuyên gia về Thái Nguyên!";
        if (score / questions.length < 0.5) {
            message = "Cố gắng hơn nhé, còn nhiều điều thú vị về Thái Nguyên đang chờ bạn khám phá!";
        } else if (score / questions.length < 0.8) {
            message = "Khá lắm! Bạn đã có kiến thức rất tốt về Thái Nguyên!";
        }
        document.getElementById('final-message').textContent = message;
        
        // Reset và hiển thị form lưu điểm
        saveScoreForm.style.display = 'flex';
        document.getElementById('player-name').value = '';
        document.getElementById('player-name').disabled = false;
        document.getElementById('save-score-btn').disabled = false;
        saveStatus.textContent = '';

        fetchLeaderboard(); // Tải bảng xếp hạng
    }

    function restartQuiz() {
        score = 0;
        currentQuestionIndex = 0;
        finalResultEl.style.display = 'none';
        gameViewEl.style.display = 'block';
        showQuestion();
    }

    // --- CÁC HÀM TƯƠNG TÁC VỚI SUPABASE ---

    // Hàm lấy dữ liệu bảng xếp hạng
    async function fetchLeaderboard() {
        leaderboardList.innerHTML = '<li>Đang tải...</li>';
        try {
            const { data, error } = await supabase
                .from('leaderboard')
                .select('player_name, score')
                .order('score', { ascending: false })
                .limit(10);

            if (error) throw error;

            if (data.length === 0) {
                leaderboardList.innerHTML = '<li>Chưa có ai trên bảng xếp hạng. Hãy là người đầu tiên!</li>';
                return;
            }

            leaderboardList.innerHTML = '';
            data.forEach((player, index) => {
                const li = document.createElement('li');
                li.textContent = ` ${player.player_name} - ${player.score} điểm`;
                
                // Thêm icon cho top 3
                if(index === 0) li.prepend('🥇');
                else if(index === 1) li.prepend('🥈');
                else if(index === 2) li.prepend('🥉');

                leaderboardList.appendChild(li);
            });
        } catch (error) {
            console.error('Lỗi khi tải bảng xếp hạng:', error.message);
            leaderboardList.innerHTML = '<li>Không thể tải được bảng xếp hạng.</li>';
        }
    }

    // Hàm lưu điểm
    async function saveScore() {
        const playerNameInput = document.getElementById('player-name');
        const saveBtn = document.getElementById('save-score-btn');
        const playerName = playerNameInput.value.trim();

        if (!playerName) {
            alert('Vui lòng nhập tên của bạn!');
            return;
        }

        saveStatus.textContent = 'Đang lưu...';
        saveBtn.disabled = true;

        try {
            const { error } = await supabase
                .from('leaderboard')
                .insert([{ player_name: playerName, score: score }]);

            if (error) throw error;

            saveStatus.textContent = 'Lưu điểm thành công!';
            playerNameInput.disabled = true;
            await fetchLeaderboard(); // Cập nhật lại bảng xếp hạng
        } catch (error) {
            console.error('Lỗi khi lưu điểm:', error.message);
            saveStatus.textContent = 'Lưu điểm thất bại!';
            saveBtn.disabled = false; // Cho phép thử lại
        }
    }


    // --- KHỞI CHẠY KHI TẢI TRANG ---
    window.onload = () => {
        document.body.classList.add('fade-in');
        setTimeout(() => {
            loadingEl.style.display = 'none';
            quizEl.style.display = 'flex';
            showQuestion();
        }, 1500);

        menuToggle.addEventListener('click', () => {
            mainNav.classList.toggle('active');
            Array.from(mainNav.children).forEach((li, index) => {
                if (mainNav.classList.contains('active')) {
                    li.style.animation = `fadeInDown 0.5s ease forwards ${index * 0.1}s`;
                } else {
                    li.style.animation = '';
                }
            });
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 992 && mainNav.classList.contains('active')) {
                mainNav.classList.remove('active');
                Array.from(mainNav.children).forEach(li => li.style.animation = '');
            }
        });
    };
    

</script>
